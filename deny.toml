[graph]
all-features = true

[sources]
unknown-registry = "deny"

[licenses]
version = 2
confidence-threshold = 1.0

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",             # Although this is copyleft, it is scoped to modifying the original files
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Ignore unmaintained required crates warning
[advisories]
ignore = [
  "RUSTSEC-2024-0388", # Unmaintained `derivative` (2024-11-22)
  "RUSTSEC-2024-0436", # Unmaintained `paste` (2025-04-04)
  "RUSTSEC-2023-0089", # Unmaintained `atomic-polyfill` (2025-06-03)
  "RUSTSEC-2025-0055", # `tracing-subscriber` < 0.3.20, requires bumps on `semaphore-rs` (and Ark deps) (2025-09-09)
  "RUSTSEC-2025-0141", # Unmaintained `bincode`, feature complete for now (2026-01-15)
  "RUSTSEC-2025-0057", # Unmaintained `fxhash` (2025-09-05)
  "RUSTSEC-2026-0173", # Unmaintained `proc-macro-error2`, build-time dep via alloy-sol-macro (2026-06-16)
  "RUSTSEC-2026-0247", # Unmaintained `bitmaps`, dep of `im` (same provekit tree) (2026-08-24)
  "RUSTSEC-2026-0248", # Unmaintained `im`, via provekit's Noir compiler fork under walletkit-core (2026-08-24)
  "RUSTSEC-2026-0251", # Unmaintained `sized-chunks`, dep of `im` (same provekit tree) (2026-08-24)
]
