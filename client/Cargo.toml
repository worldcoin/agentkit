[package]
name = "world-id-agentkit"
description = "AgentKit Client: Interface for agents + World ID through a CLI."
publish = true

license.workspace = true
version.workspace = true
edition.workspace  = true

[[bin]]
name = "agentkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walletkit-core = "0.16"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
mem_forget = "deny"
