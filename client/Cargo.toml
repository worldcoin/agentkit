[package]
name = "world-id-agentkit"
description = "AgentKit Client: Interface for agents + World ID through a CLI."
publish = true

license.workspace = true
version.workspace = true
edition.workspace  = true

[[bin]]
name = "agentkit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }
directories = "6"
getrandom = "0.3"
hex = "0.4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walletkit-core = "0.16"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "linux-native", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[lints]
workspace = true
