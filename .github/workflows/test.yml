name: Solidity CI

permissions: {}

# TODO: Re-enable push and pull_request triggers once the Solidity CI tests
# are fixed. Until then the workflow is manually-triggerable only so it does
# not fail every PR.
on:
    # push:
    # pull_request:
    workflow_dispatch:

env:
    FOUNDRY_PROFILE: ci

jobs:
    check:
        name: Foundry project
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: contracts
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1

            - name: Show Forge version
              run: forge --version

            - name: Run Forge fmt
              run: forge fmt --check

            - name: Run Forge build
              run: forge build --sizes

            - name: Run Forge tests
              run: forge test -vvv
